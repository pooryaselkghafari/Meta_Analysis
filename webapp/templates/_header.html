{# Shared sticky header — set `nav_active` before including, e.g. {% set nav_active = 'corpus' %} #}
<header class="app-header">
  <div class="app-header-inner">
    <div class="app-header-left">
      <div class="project-switcher" id="project-switcher"></div>
      <a href="/" class="app-brand" aria-label="MetaExtract home">
        <span class="app-brand-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.75"/>
            <path d="M8 15.5V8.5L12 13L16 8.5V15.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="app-title">Meta<span class="accent">Extract</span></span>
      </a>
    </div>

    <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="app-nav">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>

    <nav class="app-nav" id="app-nav">
      <a href="/" class="{{ 'active' if nav_active == 'corpus' else '' }}">Corpus</a>
      <a href="/results" class="{{ 'active' if nav_active == 'results' else '' }}">Filter results</a>
      <a href="/cheap-ai" class="{{ 'active' if nav_active == 'cheap_ai' else '' }}">Cheap AI</a>
      <a href="/detection-ai" class="{{ 'active' if nav_active == 'detection_ai' else '' }}">Detection AI</a>
      <a href="/main-ai" class="{{ 'active' if nav_active == 'main_ai' else '' }}">Main AI</a>
      <a href="/regression" class="{{ 'active' if nav_active == 'regression' else '' }}">Regression</a>
      <a href="/dashboard" class="{{ 'active' if nav_active == 'dashboard' else '' }}">Dashboard</a>
      <a href="/settings" class="{{ 'active' if nav_active == 'settings' else '' }}">Settings</a>
    </nav>
  </div>
</header>
<script>
(function () {
  const toggle = document.getElementById('nav-toggle');
  const nav = document.getElementById('app-nav');
  if (!toggle || !nav) return;
  toggle.addEventListener('click', () => {
    const open = nav.classList.toggle('is-open');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    toggle.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
  });
})();
</script>
